name: Public Source CI

on:
  push:
    branches:
      - main
    tags:
      - 'release/*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release_context:
    name: Resolve release channel
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      channel: ${{ steps.release.outputs.channel }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      version: ${{ steps.release.outputs.version }}
      asset_name: ${{ steps.release.outputs.asset_name }}

    steps:
      - name: Checkout published source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve and validate release context
        id: release
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" == refs/tags/release/* ]]; then
            version="${GITHUB_REF#refs/tags/release/}"
            if [[ -z "$version" || "$version" == */* ]]; then
              echo "Stable release tag must have the form release/<version>." >&2
              exit 1
            fi

            git fetch --force --no-tags origin \
              '+refs/heads/main:refs/remotes/origin/main'
            main_sha="$(git rev-parse 'refs/remotes/origin/main^{commit}')"
            tag_sha="$(git rev-parse "${GITHUB_REF}^{commit}")"
            if [[ "$tag_sha" != "$GITHUB_SHA" || "$main_sha" != "$GITHUB_SHA" ]]; then
              echo "Stable release tag must point to the exact current public main commit." >&2
              echo "tag=$tag_sha main=$main_sha workflow=$GITHUB_SHA" >&2
              exit 1
            fi

            echo 'channel=stable' >> "$GITHUB_OUTPUT"
            echo "release_tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "asset_name=FamilyFriend-${version}-x64.msi" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$GITHUB_REF" != 'refs/heads/main' ]]; then
            echo "Test releases may only be published from public main." >&2
            exit 1
          fi

          sha5="${GITHUB_SHA:0:5}"
          echo 'channel=test' >> "$GITHUB_OUTPUT"
          echo "release_tag=test/$sha5" >> "$GITHUB_OUTPUT"
          echo 'version=' >> "$GITHUB_OUTPUT"
          echo "asset_name=FamilyFriend-test-${sha5}-x64.msi" >> "$GITHUB_OUTPUT"

  go-test:
    name: Test published Go source
    needs: release_context
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout published source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache: true

      - name: Check Go formatting
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files '*.go')
          if [[ "${#files[@]}" -eq 0 ]]; then
            echo 'No Go files found.' >&2
            exit 1
          fi
          bad="$(gofmt -l "${files[@]}")"
          if [[ -n "$bad" ]]; then
            echo 'Unformatted Go files:' >&2
            echo "$bad" >&2
            exit 1
          fi

      - name: Run Go tests
        run: go test ./...

      - name: Check published root commit whitespace
        shell: bash
        run: git diff-tree --check --root --no-commit-id -r HEAD

  browser-test:
    name: Test published browser extension
    needs: release_context
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: mcr.microsoft.com/playwright:v1.63.0-noble

    steps:
      - name: Checkout published source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install browser test package
        working-directory: browser-extension/chrome
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Run browser extension unit tests
        working-directory: browser-extension/chrome
        run: node --test

      - name: Run Chromium extension smoke test
        working-directory: browser-extension/chrome
        run: node --test smoke.e2e.js

  windows-build:
    name: Build Windows executables
    needs:
      - go-test
      - browser-test
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout published source
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache: true

      - name: Build customer runtime executables
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force artifacts/windows | Out-Null

          go build -buildvcs=false -o artifacts/windows/drowsyfriend.exe ./cmd/drowsyfriend
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          go build -buildvcs=false -ldflags='-H=windowsgui' -o artifacts/windows/drowsyfriend-session-worker.exe ./cmd/drowsyfriend-session-worker
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          go build -tags=ci -buildvcs=false -ldflags='-H=windowsgui' -o artifacts/windows/drowsyfriend-ui.exe ./cmd/drowsyfriend-ui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows executables
        uses: actions/upload-artifact@v4
        with:
          name: family-friend-windows-executables
          path: artifacts/windows/*.exe
          if-no-files-found: error

  windows-msi:
    name: Build Windows MSI
    needs: windows-build
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - name: Checkout published source
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache: true

      - name: Verify MSI toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($tool in @('go', 'dotnet', 'gcc')) {
            if (-not (Get-Command $tool -ErrorAction SilentlyContinue)) {
              throw "Required MSI build tool '$tool' was not found on PATH."
            }
          }
          go version
          dotnet --version
          gcc --version

      - name: Build and validate MSI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          powershell -NoProfile -ExecutionPolicy Bypass -File installer/windows/build.ps1 -OutputDirectory artifacts/msi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $msi = 'artifacts/msi/FamilyFriend-x64.msi'
          if (-not (Test-Path -LiteralPath $msi -PathType Leaf)) {
            throw "Expected MSI was not produced: $msi"
          }

      - name: Upload Windows MSI
        uses: actions/upload-artifact@v4
        with:
          name: family-friend-windows-msi
          path: artifacts/msi/FamilyFriend-x64.msi
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish GitHub Release
    needs:
      - release_context
      - go-test
      - browser-test
      - windows-build
      - windows-msi
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout validated published source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download validated MSI
        uses: actions/download-artifact@v4
        with:
          name: family-friend-windows-msi
          path: artifacts/release

      - name: Prepare customer-facing MSI name
        shell: bash
        env:
          ASSET_NAME: ${{ needs.release_context.outputs.asset_name }}
        run: |
          set -euo pipefail
          source='artifacts/release/FamilyFriend-x64.msi'
          target="artifacts/release/$ASSET_NAME"
          if [[ ! -f "$source" ]]; then
            echo "Validated MSI artifact is missing: $source" >&2
            exit 1
          fi
          mv -- "$source" "$target"

      - name: Ensure deterministic release tag
        shell: bash
        env:
          CHANNEL: ${{ needs.release_context.outputs.channel }}
          RELEASE_TAG: ${{ needs.release_context.outputs.release_tag }}
        run: |
          set -euo pipefail

          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            existing_sha="$(git rev-parse "${RELEASE_TAG}^{commit}")"
            if [[ "$existing_sha" != "$GITHUB_SHA" ]]; then
              echo "Release tag $RELEASE_TAG already points to $existing_sha instead of $GITHUB_SHA." >&2
              exit 1
            fi
            exit 0
          fi

          if [[ "$CHANNEL" != 'test' ]]; then
            echo "Stable release tag is missing from the remote repository: $RELEASE_TAG" >&2
            exit 1
          fi

          git config user.name 'Drowsy Dev'
          git config user.email '332821012+drowsyydev@users.noreply.github.com'
          git tag -a "$RELEASE_TAG" "$GITHUB_SHA" -m "Family Friend test ${GITHUB_SHA:0:5}"
          git push origin "refs/tags/$RELEASE_TAG"

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ needs.release_context.outputs.channel }}
          RELEASE_TAG: ${{ needs.release_context.outputs.release_tag }}
          VERSION: ${{ needs.release_context.outputs.version }}
          ASSET_NAME: ${{ needs.release_context.outputs.asset_name }}
        run: |
          set -euo pipefail

          asset="artifacts/release/$ASSET_NAME"
          if [[ "$CHANNEL" == 'test' ]]; then
            title="Family Friend test ${GITHUB_SHA:0:5}"
            notes="Test build from validated public commit $GITHUB_SHA."
            release_flags=(--prerelease --latest=false)
            edit_flags=(--prerelease)
          else
            title="Family Friend $VERSION"
            notes="Stable Family Friend $VERSION from validated public commit $GITHUB_SHA."
            release_flags=()
            edit_flags=(--prerelease=false)
          fi

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$title" \
              --notes "$notes" \
              --verify-tag \
              "${edit_flags[@]}"
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$title" \
              --notes "$notes" \
              --verify-tag \
              "${release_flags[@]}"
          fi

          gh release upload "$RELEASE_TAG" "$asset" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
